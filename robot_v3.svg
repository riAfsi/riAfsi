<animateTransform attributeName="transform" type="rotate" values="0 270 330;0 270 330;25 270 330;-45 270 330;-70 270 330;-20 270 330;0 270 330;0 270 330" keyTimes="0;.15;.30;.47;.55;.70;.85;1" dur="3s" repeatCount="indefinite"/>
</g>

<rect x="185" y="205" width="140" height="130" rx="40" fill="url(#body)"/>
<text x="255" y="280" font-family="Arial,sans-serif" font-weight="900" font-size="30" fill="#1f2937" text-anchor="middle">A9</text>

<g>
<rect x="165" y="215" width="24" height="65" rx="12" fill="url(#body)"/>
<circle cx="177" cy="280" r="9" fill="url(#metal)"/>
<animateTransform attributeName="transform" type="rotate" values="0 177 220;0 177 220;15 177 220;-25 177 220;-35 177 220;-10 177 220;0 177 220;0 177 220" keyTimes="0;.15;.30;.47;.55;.70;.85;1" dur="3s" repeatCount="indefinite"/>
</g>
<g>
<rect x="321" y="215" width="24" height="65" rx="12" fill="url(#body)"/>
<circle cx="333" cy="280" r="9" fill="url(#metal)"/>
<animateTransform attributeName="transform" type="rotate" values="0 333 220;0 333 220;-15 333 220;25 333 220;35 333 220;10 333 220;0 333 220;0 333 220" keyTimes="0;.15;.30;.47;.55;.70;.85;1" dur="3s" repeatCount="indefinite"/>
</g>

<rect x="248" y="95" width="14" height="40" rx="6" fill="url(#metal)"/>
<circle cx="255" cy="90" r="6" fill="url(#eye)"/>
<rect x="195" y="130" width="120" height="90" rx="35" fill="url(#body)" stroke="#e5e7eb" stroke-width="2"/>
<rect x="210" y="145" width="90" height="60" rx="24" fill="#1f2937"/>
<circle cx="235" cy="175" r="10" fill="url(#eye)"/>
<circle cx="275" cy="175" r="10" fill="url(#eye)"/>
<path d="M240,195 Q255,208 270,195" fill="none" stroke="url(#eye)" stroke-width="5" stroke-linecap="round"/>
</g>

<g>
<animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,0;350,-90;355,-85;355,-85;0,0" keyTimes="0;.40;.47;.62;.68;.95;1" dur="3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.68;.80;.90;.96;1" dur="3s" repeatCount="indefinite"/>
<g>
<circle cx="350" cy="410" r="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<polygon points="350,402 344,412 350,422 356,412" fill="#1f2937"/>
<animateTransform attributeName="transform" type="rotate" values="0 350 410;0 350 410;720 350 410;720 350 410" keyTimes="0;.47;.68;1" dur="3s" repeatCount="indefinite"/>
</g>
</g>

<text x="400" y="100" font-family="Impact,sans-serif" font-size="64" font-weight="bold" fill="#facc15" stroke="#312e81" stroke-width="3" text-anchor="middle" opacity="0">GOLO!!
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.63;.68;.88;.93;1" dur="3s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="scale" values="1;0.5;1.15;1;1" keyTimes="0;.63;.66;.70;1" dur="3s" repeatCount="indefinite" additive="sum"/>
</text>
</svg>