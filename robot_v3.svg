<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a365d"/><stop offset="1" stop-color="#0a1128"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b5563"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
<radialGradient id="eye" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#eab308"/></radialGradient>
</defs>

<rect width="800" height="430" fill="url(#sky)"/>
<rect y="430" width="800" height="70" fill="url(#grass)"/>

<g stroke="#e2e8f0" fill="none">
<path d="M560,430 L560,180 L760,180 L760,430" stroke-width="5"/>
<g stroke-width="1" opacity=".45">
<path d="M580,180 L580,430 M620,180 L620,430 M660,180 L660,430 M700,180 L700,430 M740,180 L740,430"/>
<path d="M560,210 L760,210 M560,250 L760,250 M560,300 L760,300 M560,360 L760,360 M560,410 L760,410"/>
</g>
</g>

<ellipse cx="700" cy="320" rx="0" ry="0" fill="#fff" opacity=".5">
<animate attributeName="rx" values="0;0;35;28;0;0" keyTimes="0;.62;.68;.78;.85;1" dur="3s" repeatCount="indefinite"/>
<animate attributeName="ry" values="0;0;30;24;0;0" keyTimes="0;.62;.68;.78;.85;1" dur="3s" repeatCount="indefinite"/>
</ellipse>

<ellipse cx="250" cy="448" rx="70" ry="14" fill="#000" opacity=".3"/>

<g id="robot">
